name: Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate repository prerequisites
        run: |
          set -euo pipefail
          test -f AUTOPILOT.md
          test -f opencode.json
          test -f backend/pyproject.toml
          test -f backend/scripts/autopilot/orchestrator.py
          test -f backend/scripts/autopilot/status.py
          test -f .opencode/agents/autopilot-implementer.md
          test -f .opencode/agents/autopilot-evaluator.md
          test -f .opencode/agents/autopilot-guardian.md
          test -f .opencode/agents/autopilot-supervisor.md
          test -f .opencode/commands/autopilot-status.md
          echo "Repository prerequisites OK"

      - name: Decide whether to run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTOPILOT_STOP: ${{ vars.AUTOPILOT_STOP }}
        run: |
          run=true
          if [ "$AUTOPILOT_STOP" = "true" ]; then
            echo "AUTOPILOT_STOP is set"
            run=false
          elif [ "$EVENT_NAME" = "schedule" ] && [ ! -f .autopilot/state.json ]; then
            echo "No Autopilot state yet; waiting for the first manual start"
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Restore evaluation assets
        env:
          AUTOPILOT_ASSETS_URL: ${{ secrets.AUTOPILOT_ASSETS_URL }}
        run: |
          if [ -n "$AUTOPILOT_ASSETS_URL" ]; then
            curl -fL "$AUTOPILOT_ASSETS_URL" -o /tmp/autopilot-assets.tar.gz
            tar -xzf /tmp/autopilot-assets.tar.gz -C .
          fi

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -c "import tomllib, pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']; pathlib.Path('/tmp/requirements.txt').write_text('\n'.join(d))"
          python -m pip install -r /tmp/requirements.txt pytest pytest-asyncio ruff

      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip check
          python -m pytest --collect-only -q
          python -m pytest tests/test_person_down.py tests/test_enrichment.py tests/test_autopilot.py -q

      - name: Install OpenCode
        run: |
          npm install --global opencode-ai@1.19.0
          opencode --version

      - name: Run build phase
        working-directory: backend
        env:
          AUTOPILOT_STOP: ${{ vars.AUTOPILOT_STOP }}
        run: python -m scripts.autopilot.orchestrator --phase build

      - name: Write build summary
        if: always()
        working-directory: backend
        run: python -m scripts.autopilot.status --github-summary

      - name: Verify build artifact
        if: always()
        run: |
          test -d .autopilot
          test -f .autopilot/state.json || {
            echo "::error::Autopilot did not produce .autopilot/state.json"
            find .autopilot -maxdepth 1 -type f | sort
            exit 1
          }
          test -f .autopilot/outcome.json || {
            echo "::error::Autopilot did not produce .autopilot/outcome.json"
            find .autopilot -maxdepth 1 -type f | sort
            exit 1
          }
          echo "Artifact files:"
          find .autopilot -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload Autopilot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autopilot-${{ github.run_id }}
          path: .autopilot/
          include-hidden-files: true
          if-no-files-found: error

  promote:
    needs: [preflight, build]
    if: always() && needs.preflight.outputs.run == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: Checkout build base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Restore evaluation assets
        env:
          AUTOPILOT_ASSETS_URL: ${{ secrets.AUTOPILOT_ASSETS_URL }}
        run: |
          if [ -n "$AUTOPILOT_ASSETS_URL" ]; then
            curl -fL "$AUTOPILOT_ASSETS_URL" -o /tmp/autopilot-assets.tar.gz
            tar -xzf /tmp/autopilot-assets.tar.gz -C .
          fi

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -c "import tomllib, pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']; pathlib.Path('/tmp/requirements.txt').write_text('\n'.join(d))"
          python -m pip install -r /tmp/requirements.txt pytest pytest-asyncio ruff

      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip check
          python -m pytest --collect-only -q

      - name: Download Autopilot artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: autopilot-${{ github.run_id }}
          path: .autopilot

      - name: Run promote phase
        id: promote
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_DIRECT_PUSH: ${{ vars.AUTOPILOT_DIRECT_PUSH || 'true' }}
          AUTOPILOT_STOP: ${{ vars.AUTOPILOT_STOP }}
        run: python -m scripts.autopilot.orchestrator --phase promote

      - name: Write promote summary
        if: always()
        working-directory: backend
        run: python -m scripts.autopilot.status --github-summary

      - name: Queue next sprint
        if: always() && steps.promote.outcome == 'success'
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_STOP: ${{ vars.AUTOPILOT_STOP }}
        run: |
          if python -m scripts.autopilot.status --should-continue; then
            gh workflow run autopilot.yml --ref main
          else
            echo "Autopilot is complete or stopped"
          fi
