<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Threat Recognition — Operator Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1020; color: #e9eefc; min-height: 100vh; }
        .header { background: linear-gradient(90deg, #141d32, #11182a); padding: 16px 40px; border-bottom: 1px solid #26314d; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header p { color: #aeb8d4; font-size: 13px; margin-top: 2px; }
        .tabs { display: flex; gap: 4px; }
        .tab { padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: #aeb8d4; background: rgba(255,255,255,0.05); border: 1px solid transparent; }
        .tab.active { color: #75a7ff; border-color: #75a7ff; background: rgba(117,167,255,0.1); }
        .tab:hover { color: #e9eefc; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
        .page { display: none; }
        .page.active { display: block; }
        .upload-box { border: 2px dashed #36517b; border-radius: 16px; padding: 40px; text-align: center; background: rgba(255,255,255,0.02); }
        .upload-box input[type="file"] { display: none; }
        .btn { display: inline-block; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: #75a7ff; color: #0b1020; }
        .btn-danger { background: #ff7f8f; }
        .btn-success { background: #86e0a3; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid #26314d; border-radius: 12px; padding: 20px; text-align: center; }
        .stat-card .num { font-size: 32px; font-weight: 800; color: #75a7ff; }
        .stat-card .label { font-size: 13px; color: #aeb8d4; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 12px; text-transform: uppercase; color: #aeb8d4; border-bottom: 1px solid #26314d; }
        td { padding: 12px; border-bottom: 1px solid #1a2236; font-size: 14px; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.high { background: #ff7f8f; color: #0b1020; }
        .badge.medium { background: #f3c969; color: #0b1020; }
        .badge.low { background: #86e0a3; color: #0b1020; }
        .badge.detected { background: #ff7f8f; color: #0b1020; }
        .badge.pending { background: #f3c969; color: #0b1020; }
        .badge.verified { background: #86e0a3; color: #0b1020; }
        .badge.dismissed { background: #aeb8d4; color: #0b1020; }
        .detection { display: flex; gap: 20px; padding: 16px; border-radius: 12px; margin-bottom: 12px; background: rgba(255,255,255,0.03); border: 1px solid #26314d; align-items: flex-start; }
        .detection img { width: 320px; border-radius: 8px; flex-shrink: 0; }
        .detection-info { flex: 1; }
        .progress { display: none; text-align: center; padding: 40px; }
        .progress.show { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #26314d; border-top-color: #75a7ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 20px; align-items: center; }
        .pagination button { padding: 6px 14px; border-radius: 6px; border: 1px solid #26314d; background: rgba(255,255,255,0.05); color: #e9eefc; cursor: pointer; }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination span { font-size: 14px; color: #aeb8d4; }
        .filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .filters select, .filters input { padding: 8px 12px; border-radius: 8px; border: 1px solid #26314d; background: rgba(255,255,255,0.05); color: #e9eefc; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>AI Video Threat Recognition</h1><p>Operator Dashboard</p></div>
        <div class="tabs">
            <div class="tab active" onclick="showPage('detect')">Detect</div>
            <div class="tab" onclick="showPage('incidents')">Incidents</div>
            <div class="tab" onclick="showPage('dashboard')">Dashboard</div>
        </div>
    </div>
    <div class="container">
        <div id="page-detect" class="page active">
            <div class="upload-box" id="uploadBox">
                <h2 style="margin-bottom:8px">Drop video here or click to upload</h2>
                <p style="color:#aeb8d4;margin-bottom:16px">Supports MP4, AVI, MOV</p>
                <input type="file" id="fileInput" accept="video/*">
                <button class="btn" onclick="document.getElementById('fileInput').click()">Choose Video</button>
            </div>
            <div class="progress" id="progress"><div class="spinner"></div><p>Analyzing video...</p></div>
            <div id="results" style="display:none;margin-top:24px">
                <div id="summary" style="padding:16px 20px;border-radius:10px;margin-bottom:20px;font-size:16px;font-weight:600"></div>
                <div id="alerts"></div>
                <div id="detections"></div>
            </div>
        </div>
        <div id="page-incidents" class="page">
            <div class="filters">
                <select id="filter-status" onclick="loadIncidents()"><option value="">All Status</option><option value="detected">Detected</option><option value="pending_review">Pending</option><option value="verified">Verified</option><option value="dismissed">Dismissed</option></select>
                <select id="filter-severity" onclick="loadIncidents()"><option value="">All Severity</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
                <select id="filter-rule" onclick="loadIncidents()"><option value="">All Rules</option><option value="weapon">Weapon</option><option value="violence">Violence</option><option value="person_down">Person Down</option><option value="crowd_anomaly">Crowd</option><option value="loitering">Loitering</option><option value="altercation">Altercation</option></select>
            </div>
            <div id="incident-list"></div>
            <div class="pagination" id="pagination"></div>
        </div>
        <div id="page-dashboard" class="page">
            <div class="stats-grid">
                <div class="stat-card"><div class="num" id="stat-cameras">0</div><div class="label">Total Cameras</div></div>
                <div class="stat-card"><div class="num" id="stat-incidents">0</div><div class="label">Total Incidents</div></div>
                <div class="stat-card"><div class="num" id="stat-threats">0</div><div class="label">Active Threats</div></div>
                <div class="stat-card"><div class="num" id="stat-today">0</div><div class="label">Today</div></div>
            </div>
        </div>
    </div>
    <script>
        let currentPage = 1;
        function showPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('page-' + name).classList.add('active');
            event.target.classList.add('active');
            if (name === 'incidents') loadIncidents();
            if (name === 'dashboard') loadDashboard();
        }
        async function loadDashboard() {
            try {
                const resp = await fetch('/dashboard/stats');
                const data = await resp.json();
                document.getElementById('stat-cameras').textContent = data.total_cameras;
                document.getElementById('stat-incidents').textContent = data.total_incidents;
                document.getElementById('stat-threats').textContent = data.pending_incidents;
                document.getElementById('stat-today').textContent = data.incidents_last_24h;
            } catch(e) { console.error(e); }
        }
        async function loadIncidents(page=1) {
            currentPage = page;
            const status = document.getElementById('filter-status').value;
            const severity = document.getElementById('filter-severity').value;
            const rule = document.getElementById('filter-rule').value;
            let url = `/incidents/?page=${page}&page_size=10`;
            if (status) url += `&status=${status}`;
            if (severity) url += `&severity=${severity}`;
            if (rule) url += `&event_type=${rule}`;
            try {
                const resp = await fetch(url);
                const data = await resp.json();
                const list = document.getElementById('incident-list');
                if (data.items.length === 0) { list.innerHTML = '<p style="color:#aeb8d4;text-align:center;padding:40px">No incidents found</p>'; return; }
                list.innerHTML = `<table><tr><th>ID</th><th>Event</th><th>Severity</th><th>Status</th><th>Time</th><th></th></tr>${data.items.map(i => `<tr><td>${i.id}</td><td>${i.event_type}</td><td><span class="badge ${i.severity}">${i.severity}</span></td><td><span class="badge ${i.status}">${i.status.replace('_',' ')}</span></td><td>${new Date(i.first_seen_at).toLocaleString()}</td><td><button class="btn" onclick="verifyIncident(${i.id},true)" style="padding:4px 12px;font-size:12px">Verify</button> <button class="btn btn-danger" onclick="verifyIncident(${i.id},false)" style="padding:4px 12px;font-size:12px">Dismiss</button></td></tr>`).join('')}</table>`;
                const totalPages = Math.ceil(data.total / 10);
                document.getElementById('pagination').innerHTML = `<button onclick="loadIncidents(${page-1})" ${page<=1?'disabled':''}>Prev</button><span>Page ${page} of ${totalPages} (${data.total} total)</span><button onclick="loadIncidents(${page+1})" ${page>=totalPages?'disabled':''}>Next</button>`;
            } catch(e) { console.error(e); }
        }
        async function verifyIncident(id, verified) {
            await fetch(`/incidents/${id}/verify`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({verified})});
            loadIncidents(currentPage);
        }
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        uploadBox.addEventListener('drop', e => { e.preventDefault(); fileInput.files = e.dataTransfer.files; uploadFile(); });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(); });
        async function uploadFile() {
            const file = fileInput.files[0];
            if (!file) return;
            document.getElementById('progress').classList.add('show');
            document.getElementById('results').style.display = 'none';
            uploadBox.style.display = 'none';
            const formData = new FormData();
            formData.append('video', file);
            try {
                const resp = await fetch('/api/detect', {method:'POST',body:formData});
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || 'Failed');
                displayResults(data);
            } catch(err) { alert(err.message); }
            document.getElementById('progress').classList.remove('show');
            uploadBox.style.display = 'block';
        }
        function displayResults(data) {
            document.getElementById('results').style.display = 'block';
            const threats = data.detections.filter(d => d.is_threat);
            const events = data.events || [];
            const summary = document.getElementById('summary');
            const alerts = document.getElementById('alerts');
            const detsDiv = document.getElementById('detections');
            if (events.length > 0) { summary.style.cssText='background:rgba(255,127,143,0.1);border:1px solid #ff7f8f'; summary.textContent = events.map(e=>e.rule.replace('_',' ')).join(' + ') + ' detected'; }
            else if (threats.length > 0) { summary.style.cssText='background:rgba(255,127,143,0.1);border:1px solid #ff7f8f'; summary.textContent = threats.length + ' threat(s) detected'; }
            else { summary.style.cssText='background:rgba(134,224,163,0.1);border:1px solid #86e0a3'; summary.textContent = 'No threats detected'; }
            alerts.innerHTML = events.map(e => `<div class="detection" style="border-color:#ff7f8f"><div class="detection-info"><div style="font-weight:700;color:#75a7ff">t=${e.timestamp}s</div><div style="font-weight:600;color:#ff7f8f">${e.rule.replace('_',' ').toUpperCase()}</div><div style="font-size:13px;color:#aeb8d4">Severity: ${e.severity}</div></div></div>`).join('');
            detsDiv.innerHTML = data.detections.filter(d=>d.frame_image).map(d => `<div class="detection"><img src="data:image/jpeg;base64,${d.frame_image}"><div class="detection-info"><div style="font-weight:700;color:#75a7ff">t=${d.timestamp}s | Track #${d.track_id}</div><div style="font-weight:600;${d.is_threat?'color:#ff7f8f':''}">${d.class_name}</div><div style="font-size:13px;color:#aeb8d4">Confidence: ${(d.confidence*100).toFixed(1)}%</div></div></div>`).join('');
        }
    </script>
</body>
</html>
