[project]
name = "ai-video-threat-recognition"
version = "0.1.0"
description = "AI Video Threat Recognition - FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    "opencv-python-headless>=4.9.0",
    "ultralytics>=8.3.0",
    "supervision>=0.19.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "prometheus-client>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "pre-commit>=3.7.0",
    "faker>=24.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PT", "T20", "W", "N", "S", "PL", "TRY", "PD", "RUF", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "FURB", "LOG", "PIE", "NPY", "ICN", "PERF", "TC", "INT"]
ignore = ["S101", "PLR2004", "TRY003", "PLR0913", "PLR0915"]
fixable = ["ALL"]
unfixable = ["T20", "S101", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is built on call-in-default, which B008
# (wrongly) flags. Silencing it is the standard remedy for FastAPI projects.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "PLR0913", "PLR0915"]
"scripts/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["app", "workers"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"